; PlatformIO Project Configuration File
; Fall Detector - ESP32-WROOM-32 + MPU6050 + Edge Impulse + Telegram Bot
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600

; --- Thu vien ---
; Thu vien Edge Impulse (lib/ei-fall-detection) se duoc PlatformIO tu dong nhan.
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5

; WiFiClientSecure, Wire, WiFi da co san trong Arduino-ESP32.
lib_ldf_mode = chain+

build_flags =
    -DCORE_DEBUG_LEVEL=1
